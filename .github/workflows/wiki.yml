name: Wiki
# The wiki is built from the player docs here plus the open pull requests with
# the wiki label that change them. Pull requests open, merge and get labelled
# without a push, so a daily run keeps the "Coming soon" notes current.
on:
  push:
    branches: [nightly]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths: [README.md, docs/**, scripts/wiki/**, .github/workflows/wiki.yml]
  pull_request:
    paths: [README.md, docs/**, scripts/wiki/**, .github/workflows/wiki.yml]
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.repository == 'Confetti3/sf4-ember-builds' && 'namespace-profile-emberbuilds' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Scheduled runs start on the default branch, but the wiki follows nightly.
      # A tag run, pushed or started by hand from the tag, builds the tag's commit: the release snapshot must be
      # that release's docs. A run started by hand from a release tag catches up a release missed while
      # WIKI_PUBLISH was off, but only for a tag whose commit has this workflow; older tags run their own.
      REF: ${{ (github.event_name == 'push' || github.ref_type == 'tag') && github.sha || 'refs/heads/nightly' }}
    steps:
      - name: Check out nightly or the pushed commit
        run: |
          # Only a release tag has a snapshot; any other tag's commit would replace nightly's pages with old ones.
          if [ "$GITHUB_REF_TYPE" = tag ] && ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a release tag (vX.Y.Z); start the run from nightly instead"
            exit 1
          fi
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # The whole history, without file contents: the stale check reads it.
          git -c protocol.version=2 fetch --filter=blob:none origin "$REF"
          git checkout --detach FETCH_HEAD
          # Fetching one commit brings no tag; the footer names a release by the tag at HEAD.
          if [ "$GITHUB_REF_TYPE" = tag ]; then git tag "$GITHUB_REF_NAME" FETCH_HEAD; fi
      - name: Build and check the wiki
        run: |
          python3 scripts/wiki/test_wiki.py
          python3 scripts/wiki/build.py --wiki "$GITHUB_REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/wiki/check.py | tee -a "$GITHUB_STEP_SUMMARY"
          # Only reports: an older picture is better than no wiki.
          python3 scripts/wiki/stale.py | tee -a "$GITHUB_STEP_SUMMARY"
      # Publishing waits until the repository variable WIKI_PUBLISH is "true", so a
      # fork can stage the wiki on its own before the main repository turns it on.
      - name: Publish the wiki
        if: vars.WIKI_PUBLISH == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 scripts/wiki/publish.py --repo "$GITHUB_REPOSITORY"
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.repository == 'Confetti3/sf4-ember-builds' && 'namespace-profile-emberbuilds' || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out the pull request and its base
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --filter=blob:none origin "$GITHUB_SHA" "$BASE"
          git checkout --detach "$GITHUB_SHA"
          git worktree add --detach build/base "$BASE"
      - name: Build the wiki from the base and from the change and show what changes
        run: |
          python3 scripts/wiki/test_wiki.py
          python3 scripts/wiki/build.py --wiki "$GITHUB_REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/wiki/check.py | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/wiki/stale.py | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p build/wiki-base
          # The base is only there for the diff; a base that does not build is noted, not a failure.
          if [ -f build/base/scripts/wiki/build.py ]; then
            python3 build/base/scripts/wiki/build.py --out "$PWD/build/wiki-base" \
              || echo "The base does not build; the diff below is against nothing." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo '```diff'
            diff -ru -x 'banner-*.svg' build/wiki-base build/wiki || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Players link to the live wiki: a page it has that this build drops fails here, while it is still a
          # pull request, through the same check the publish makes.
          python3 scripts/wiki/publish.py --repo "$GITHUB_REPOSITORY" --dry-run
