[package]
name = "ember-reports"
description = "Opt-in crash and problem report intake for SF4 Ember Netplay"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "multipart", "tokio"] }
async-trait = "0.1"
breakpad-symbols = "=0.27.0"
futures-util = "0.3"
http-body-util = "0.1"
minidump = "=0.27.0"
minidump-processor = "=0.27.0"
minidump-unwind = "=0.27.0"
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", default-features = false, features = ["limit"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
minidump-synth = "=0.27.0"
test-assembler = "0.1.6"
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
strip = "debuginfo"
lto = "thin"
