# Include inside the embernetplay.link HTTPS server only.
# proxy_pass must name the port the service binds; config.rs BIND_PORT is the
# only port its validation accepts.
location = /report/v1 {
    if ($request_method != POST) { return 405; }
    client_max_body_size 5m;
    client_body_timeout 20s;
    # Stream uploads rather than writing player data to nginx temporary files.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_intercept_errors off;
    limit_req zone=ember_reports burst=3 nodelay;
    limit_req_status 429;
    # nginx does not calculate a dynamic retry time for limit_req.
    error_page 429 = @ember_reports_rate_limit;
    proxy_pass http://127.0.0.1:47850;
    proxy_set_header Host embernetplay.link;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    # A location with any add_header of its own inherits none from the server,
    # so the common site headers are included here and in the 429 location.
    include snippets/ember-reports-headers.conf;
    add_header Cache-Control "no-store" always;
    access_log off;
    # Prevent nginx error logs recording the client's address/request details.
    error_log /dev/null crit;
}
location @ember_reports_rate_limit {
    include snippets/ember-reports-headers.conf;
    add_header Retry-After "10" always;
    add_header Cache-Control "no-store" always;
    return 429;
    access_log off;
    error_log /dev/null crit;
}
