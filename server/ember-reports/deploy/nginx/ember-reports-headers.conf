# Headers every embernetplay.link response carries, kept in step with
# ember-short-headers.conf. nginx gives a location the server's add_header lines
# only when it has none of its own, so each report location includes this file
# and then sets its own Cache-Control. This service's setup.sh installs it, so
# the report routes never depend on the short-link installer having run.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
