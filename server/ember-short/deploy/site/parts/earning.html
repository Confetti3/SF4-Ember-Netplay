<h2>How points are earned</h2>
<p class="note">Every rated public game adds 1 point, win or lose. A win adds 1 more when your opponent's class is the same as yours or higher, or when either of you has no class yet. Points never go down.</p>
<p class="note">Past eight games against the same player in one sitting, games stop counting.</p>
</section>
