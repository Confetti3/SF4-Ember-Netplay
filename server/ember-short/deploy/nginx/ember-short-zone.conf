# Ember short invitation links: one request budget per client address for the
# /s/ API, ahead of the service's own per-address limits.
limit_req_zone $binary_remote_addr zone=ember_short:1m rate=30r/m;

# The public rooms page's list (/rooms.json, the bridge's /v1/rooms/public):
# one request budget per client address (players behind one NAT share it),
# and every answer kept for five seconds, so however many pages are open the
# bridge answers at most one listing per five seconds. setup.sh makes the
# cache folder.
limit_req_zone $binary_remote_addr zone=ember_rooms:1m rate=60r/m;
proxy_cache_path /var/lib/nginx/ember-rooms levels=1 keys_zone=ember_rooms_cache:1m max_size=4m inactive=1m use_temp_path=off;
