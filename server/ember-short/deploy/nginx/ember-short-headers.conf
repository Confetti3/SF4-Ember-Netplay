# Headers every embernetplay.link response carries. nginx gives a location
# the server's add_header lines only when it has none of its own, so the
# server and each location in ember-short.conf with its own headers include
# this file. Each also sets a Content-Security-Policy that suits it.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
