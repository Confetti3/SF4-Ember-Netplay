    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}

# The guides (/docs and /docs/GUIDE) and the frame data (/frame-data and
# /frame-data/FIGHTER): pages scripts/site/make.py builds from the player
# guides and the frame data pages. Each is the file of its own name with
# ".html" (docs.html, docs/install.html), which try_files serves in this
# location, with these headers.
location ~ "^/(docs|frame-data)(/[a-z0-9-]+)?$" {
    access_log off;
    try_files $uri.html =404;
    gzip on;
    gzip_vary on;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
# Only through the location above, never by a file's own name without the CSP.
location ~ "^/(docs|frame-data)(/[a-z0-9-]+)?\.html$" {
    internal;
}
# With a slash at the end each is a folder of the site, which has no page.
location ~ "^/(docs|frame-data)/$" {
    return 301 /$1;
}
# What the guides' search reads: every guide and heading with the words under it.
location = /docs/search.json {
    access_log off;
    gzip on;
    gzip_types application/json;
    gzip_vary on;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}
# The guides' pictures and sounds. A changed picture gets a new guide page but
# keeps its name, so they are checked again after a day.
location ^~ /docs/files/ {
    access_log off;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}

# The landing page reads the public rooms from /rooms.json; the 404 page
# has no scripts. "location = /" serves the
# file itself: the index directive would redirect to /index.html internally
# and leave these headers behind.
location = / {
    try_files /index.html =404;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
location = /index.html {
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
location = /404.html {
    internal;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}

location = /favicon.ico {
    access_log off;
    log_not_found off;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}

# Stylesheet and script keep fixed names, so browsers check them on every
# load (a 304 when unchanged); the pages change with them. Fonts and images
# do not change, so they are cached for a week. mime.types already has
# font/woff2 and image/webp.
location ^~ /assets/ {
    access_log off;
    charset utf-8;
    gzip_types text/css application/javascript text/plain;
    gzip_vary on;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location ~ \.(css|js)$ {
        include snippets/ember-short-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
