# Ember short invitation links and the site's own pages, included in the
# embernetplay.link 443 server.
#
# /s/ is the store API on 127.0.0.1:47810. Its paths carry only opaque
# locators, and nothing here logs them.
# /j (a room's short link), /m (a tournament match a site links to), /r (a
# public room a bot or site links to) and /start (getting Ember for
# tournaments, or connecting Discord for a site's service) open the same page.
# The code, match, room or service is in the URL fragment, which browsers never
# send, so the server sees only the path. A match page then asks
# /link/BRIDGE/MATCH whether its match is over, which this server hands to that
# bridge's GET /v1/matches/MATCH/link.
# /rooms lists the public rooms open now, from /rooms.json (Ultra Street
# Fighter IV's, SF4 Ember's bridge) and /rooms-sfv.json (Street Fighter V's,
# SFV Ember's own bridge).
# /rankings lists players by class, from /rankings.json (Ultra Street Fighter
# IV's) and /rankings-sfv.json (Street Fighter V's), from the same two bridges.
# /points lists players by points, from /points.json; /me is a player's own
# card and /players another's, which a browser signed in with Discord reads
# from /account/ (Ultra Street Fighter IV's alone, SF4 Ember's bridge).
# /docs is the player guides and /frame-data each fighter's frame data.
# / is the landing page, and any other missing path gets 404.html.

# No nginx version on error pages or in the Server header of this server.
# (nginx.conf sets server_tokens for the http block; this only overrides it here.)
server_tokens off;
# The API's own errors pass through: /s/ does not intercept them.
error_page 404 /404.html;

# For the API and the site's other files. A location below with any add_header
# of its own gets none of these, so it includes the shared headers again.
include snippets/ember-short-headers.conf;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

location ^~ /s/ {
    access_log off;
    limit_req zone=ember_short burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:47810;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_buffering off;
    proxy_intercept_errors off;
}

# A room link typed with the code in the path (/j/CODE, or /v/CODE for an
# SFV Ember room) opens it too.
# try_files serves open.html in this location, with these headers.
location ~ ^/([jmrv](/|$)|start/?$) {
    access_log off;
    try_files /open.html =404;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
# Only through the location above, never by its own name without the CSP.
location = /open.html {
    internal;
}

# Whether a match a link names is over, from the production bridge on
# 127.0.0.1:47820 or the staging bridge on 127.0.0.1:47821. The answer is only
# {"over": true|false, "game": "usf4"|"sfv"}; nothing here needs or forwards a credential, and the
# match ID in the path is not logged.
location ~ "^/link/brg_0dbc0598-2312-4ce3-9df8-e160330565e6/(emt_[0-9a-f-]{36})$" {
    access_log off;
    limit_req zone=ember_match_links burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:47820/v1/matches/$1/link;
    proxy_http_version 1.1;
    proxy_set_header Host bridge.embernetplay.link;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass_request_body off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors off;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}
location ~ "^/link/brg_1195478b-ac7e-4bc9-90af-c74eac5c747b/(emt_[0-9a-f-]{36})$" {
    access_log off;
    limit_req zone=ember_match_links burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:47821/v1/matches/$1/link;
    proxy_http_version 1.1;
    proxy_set_header Host bridge-staging.embernetplay.link;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass_request_body off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors off;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}

# Whether a match on SFV Ember's own bridge (127.0.0.1:47822) is over. Its
# bridge ID is made when it is installed, so the link page learns it from
# /rooms-sfv.json and asks here by match alone; the answer is the same
# {"over": ..., "game": "sfv"} as above.
location ~ "^/link-sfv/(emt_[0-9a-f-]{36})$" {
    access_log off;
    limit_req zone=ember_match_links burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:47822/v1/matches/$1/link;
    proxy_http_version 1.1;
    proxy_set_header Host sfv-bridge.embernetplay.link;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass_request_body off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors off;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}

# The public rooms page, and the list it reads from the Ember bridge on
# 127.0.0.1:47820. The list is what any Ember ID can see in Ember; nothing
# here needs or forwards a credential.
location = /rooms {
    access_log off;
    try_files /rooms.html =404;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
location = /rooms.html {
    internal;
}
location = /rooms.json {
    access_log off;
    limit_req zone=ember_rooms burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:47820/v1/rooms/public;
    proxy_http_version 1.1;
    proxy_set_header Host bridge.embernetplay.link;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass_request_body off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_cache ember_rooms_cache;
    proxy_cache_key "rooms";
    proxy_cache_valid 200 5s;
    proxy_cache_valid any 2s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_intercept_errors off;
    gzip on;
    gzip_types application/json;
    gzip_vary on;
    gzip_proxied any;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}
# Street Fighter V's rooms: the same list from SFV Ember's own bridge on
# 127.0.0.1:47822 (docs/design/SFV_BRIDGE.md), for its game "sfv". Its
# bridge_id is how the link page knows that bridge's room and match links.
location = /rooms-sfv.json {
    access_log off;
