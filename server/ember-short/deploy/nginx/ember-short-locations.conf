# Ember short invitation links and the site's own pages, included in the
# embernetplay.link 443 server.
#
# /s/ is the store API on 127.0.0.1:47810. Its paths carry only opaque
# locators, and nothing here logs them.
# /j (a room's short link), /m (a tournament match a site links to), /r (a
# public room a bot or site links to) and /start (getting Ember for
# tournaments, or connecting Discord for a site's service) open the same page.
# The code, match, room or service is in the URL fragment, which browsers never
# send, so the server sees only the path.
# /rooms lists the public rooms open now, from /rooms.json.
# / is the landing page, and any other missing path gets 404.html.

# No nginx version on error pages or in the Server header of this server.
# (nginx.conf sets server_tokens for the http block; this only overrides it here.)
server_tokens off;
# The API's own errors pass through: /s/ does not intercept them.
error_page 404 /404.html;

# For the API and the site's other files. A location below with any add_header
# of its own gets none of these, so it includes the shared headers again.
include snippets/ember-short-headers.conf;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

location ^~ /s/ {
    access_log off;
    limit_req zone=ember_short burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:47810;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_buffering off;
    proxy_intercept_errors off;
}

# A room link typed with the code in the path (/j/CODE) opens it too.
# try_files serves open.html in this location, with these headers.
location ~ ^/([jmr](/|$)|start/?$) {
    access_log off;
    try_files /open.html =404;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
# Only through the location above, never by its own name without the CSP.
location = /open.html {
    internal;
}

# The public rooms page, and the list it reads from the Ember bridge on
# 127.0.0.1:47820. The list is what any Ember ID can see in Ember; nothing
# here needs or forwards a credential.
location = /rooms {
    access_log off;
    try_files /rooms.html =404;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
location = /rooms.html {
    internal;
}
location = /rooms.json {
    access_log off;
    limit_req zone=ember_rooms burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:47820/v1/rooms/public;
    proxy_http_version 1.1;
    proxy_set_header Host bridge.embernetplay.link;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass_request_body off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_cache ember_rooms_cache;
    proxy_cache_key "rooms";
    proxy_cache_valid 200 5s;
    proxy_cache_valid any 2s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_intercept_errors off;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}

# The landing page reads the public room count from /rooms.json; the 404 page
# has no scripts. "location = /" serves the
# file itself: the index directive would redirect to /index.html internally
# and leave these headers behind.
location = / {
    try_files /index.html =404;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
location = /index.html {
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
location = /404.html {
    internal;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}

location = /favicon.ico {
    access_log off;
    log_not_found off;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}

# Stylesheet and script keep fixed names, so browsers check them on every
# load (a 304 when unchanged); the pages change with them. Fonts and images
# do not change, so they are cached for a week. mime.types already has
# font/woff2 and image/webp.
location ^~ /assets/ {
    access_log off;
    charset utf-8;
    gzip_types text/css application/javascript text/plain;
    gzip_vary on;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location ~ \.(css|js)$ {
        include snippets/ember-short-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
