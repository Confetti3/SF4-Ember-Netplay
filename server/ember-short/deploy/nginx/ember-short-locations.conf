# The points boards from the Ember bridge (GET /v1/points/board/public):
# the account board, or one fighter's with ?fighter=0 to 43. Only that
# argument is passed on ($ember_points_query, ember-short-zone.conf), and any
# other value of it is refused here, so the cache holds at most one answer a
# board. A board is public like the class board: no credential is needed or
# forwarded.
location = /points.json {
    access_log off;
    limit_except GET {
        deny all;
    }
    limit_req zone=ember_points burst=20 nodelay;
    limit_req_status 429;
    if ($ember_points_query = "bad") {
        return 400;
    }
    proxy_pass http://127.0.0.1:47820/v1/points/board/public$ember_points_query;
    proxy_http_version 1.1;
    proxy_set_header Host bridge.embernetplay.link;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass_request_body off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_cache ember_points_cache;
    proxy_cache_key "points$ember_points_query";
    proxy_cache_valid 200 404 30s;
    proxy_cache_valid any 5s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_intercept_errors off;
    gzip on;
    gzip_types application/json;
    gzip_vary on;
    gzip_proxied any;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}

# Signing in to the site with Discord, and what a signed-in browser reads, from
# the Ember bridge (/v1/website/*; SFV Ember's bridge has no such routes). The
# session is the bridge's HttpOnly cookie: the browser's Cookie header goes to
# the bridge and its Set-Cookie and redirects come back as they are, so
# nothing here is cached, and the client's address goes along for the
# bridge's own limits. The sign-in and its callback are redirects; the rest
# are JSON. Each takes only the method it answers.
location = /account/sign-in {
    access_log off;
    limit_except GET {
        deny all;
    }
    limit_req zone=ember_account burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:47820/v1/website/sign-in;
    proxy_http_version 1.1;
    proxy_set_header Host bridge.embernetplay.link;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
    proxy_redirect off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_cache off;
    proxy_intercept_errors off;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}
# Discord returns here with the code and the state. The bridge asks Discord
# who signed in, so it may take longer than the other routes. The query holds
# the code, which is not logged.
location = /account/discord/callback {
    access_log off;
    limit_except GET {
        deny all;
    }
    limit_req zone=ember_account burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:47820/v1/website/discord/callback$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host bridge.embernetplay.link;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
    proxy_redirect off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_cache off;
    proxy_intercept_errors off;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}
location = /account/sign-out {
    access_log off;
    limit_except POST {
        deny all;
    }
    limit_req zone=ember_account burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:47820/v1/website/sign-out;
    proxy_http_version 1.1;
    proxy_set_header Host bridge.embernetplay.link;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_cache off;
    proxy_intercept_errors off;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}
location = /account/me.json {
    access_log off;
    limit_except GET {
        deny all;
    }
    limit_req zone=ember_account burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:47820/v1/website/me;
    proxy_http_version 1.1;
    proxy_set_header Host bridge.embernetplay.link;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_cache off;
    proxy_intercept_errors off;
    gzip on;
    gzip_types application/json;
    gzip_vary on;
    gzip_proxied any;
    include snippets/ember-short-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}
# A card asked by token or by name: {"card": "c1...."} or {"name": "..."}.
location = /account/card.json {
    access_log off;
    limit_except POST {
        deny all;
    }
    limit_req zone=ember_account burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:47820/v1/website/card;
    proxy_http_version 1.1;
    proxy_set_header Host bridge.embernetplay.link;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
