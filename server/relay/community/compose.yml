# An Ember relay beside Nginx Proxy Manager, on the same machine. Settings
# come from .env (copy .env.example). See README.md.
services:
  ember-relay:
    build: .
    image: ember-relay:1.1.0
    container_name: ember-relay
    restart: unless-stopped
    # The host's own network: QUIC address discovery tells each player the
    # address their packets arrive from, and a published Docker port can
    # replace that address with Docker's.
    network_mode: host
    # The owner of the proxy's certificate files, with no capabilities: it
    # can read those files as their owner and nothing else on the machine.
    user: ${RELAY_USER:-0:0}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RELAY_HOSTNAME: ${RELAY_HOSTNAME:?set RELAY_HOSTNAME in .env}
      RELAY_CERT_NAME: ${RELAY_CERT_NAME:?set RELAY_CERT_NAME in .env}
      RELAY_HTTP_PORT: ${RELAY_HTTP_PORT:-47895}
      # Warnings only: at info the relay logs every client it serves.
      RUST_LOG: warn
    # Only the relay's own certificate, read-only: its live folder holds
    # links into its archive folder, so both keep their places. A folder that
    # does not exist is an error, never created.
    volumes:
      - type: bind
        source: ${NPM_LETSENCRYPT_DIR:?set NPM_LETSENCRYPT_DIR in .env}/live/${RELAY_CERT_NAME}
        target: /etc/letsencrypt/live/${RELAY_CERT_NAME}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NPM_LETSENCRYPT_DIR}/archive/${RELAY_CERT_NAME}
        target: /etc/letsencrypt/archive/${RELAY_CERT_NAME}
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /run/ember-relay:mode=1777
    mem_limit: 512m
    pids_limit: 256
    ulimits:
      nofile: 65536
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    healthcheck:
      test: ["CMD", "/usr/local/bin/ember-relay", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
