# An Ember relay as a container. Host networking: clients reach it on 443 and
# UDP 7842 (or on the port a reverse proxy forwards to), and the relay sees
# their real addresses for address discovery.
#
#   cd server/ember-relay && cp config.example.toml config.toml && docker compose up -d --build
services:
  ember-relay:
    image: ember-relay
    build: .
    network_mode: host
    restart: unless-stopped
    read_only: true
    volumes:
      - ./config.toml:/etc/ember-relay/config.toml:ro
      # Let's Encrypt account and certificates, so a restart issues none.
      - ./certs:/var/lib/ember-relay/certs
    cap_drop:
      - ALL
    cap_add:
      # Ports 80 and 443, when the relay serves HTTPS itself.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
