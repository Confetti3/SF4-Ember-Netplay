# Ember bridge: request budgets per client address, ahead of the bridge's own
# per-identity limits. Unauthenticated callers can choose any Ember key, so
# the proof routes get a tighter budget by address.
limit_req_zone $binary_remote_addr zone=ember_bridge:2m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ember_bridge_proof:2m rate=60r/m;
# Open event streams: a few per address and a ceiling for the whole bridge,
# since each one holds an upstream connection for as long as it lasts.
limit_conn_zone $binary_remote_addr zone=ember_bridge_streams:2m;
limit_conn_zone $server_name zone=ember_bridge_streams_total:1m;
