[package]
name = "ember-bridge"
description = "Provider-neutral Ember tournament bridge: identity linking, matches, events and webhooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# `ember_bridge::testing`: what the tests of this workspace share to run a
# bridge on loopback. Off in every build for deployment; the tests turn it on
# through dev-dependencies.
test-support = []

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "form"] }
base64 = "0.22"
ember-protocol = { path = "../protocol" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hmac = "0.12"
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
zeroize = "1"

[dev-dependencies]
ed25519-dalek = "=3.0.0"
# The tests of this crate use the same testing module as the other crates.
ember-bridge = { path = ".", features = ["test-support"] }
