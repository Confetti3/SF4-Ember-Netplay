# A tournament bridge under Docker, published on the host for a reverse proxy
# that serves its origin over HTTPS. The proxy must not buffer
# /v1/events/stream (bridge/deploy/nginx/bridge.conf.in has the settings).
#
# .env next to this file:
#   BRIDGE_PORT  host port the proxy forwards to
#   BRIDGE_BIND  host address it is published on (default 127.0.0.1, for a
#                proxy on this host). A proxy on another host needs this
#                host's address here.
#   BRIDGE_DATA  host folder for bridge.json, its secrets and database (0700)
#   BRIDGE_USER  uid:gid that owns BRIDGE_DATA (default 4784:4784, the image's)
#   NOTIFIER_PORT, NOTIFIER_DATA  the same for ember-notifier (default 8790
#                and ./notifier), whose notifier.json listens on 0.0.0.0:8790;
#                it runs with `--profile notifier`, and its Discord
#                interactions endpoint is https://<host>/discord/interactions
#   BRACKETS_PORT, BRACKETS_DATA  the same for ember-brackets (default 8791
#                and ./brackets), whose brackets.json listens on 0.0.0.0:8791
#                (results.listen); it runs with `--profile brackets`
#
# bridge.json's trusted_proxies names the address the bridge sees the proxy
# connect from: the Docker network's gateway for a proxy on this host, or
# the proxy's own address. Only those proxies' X-Real-IP is read, so the
# per-address limits hold for anyone else who reaches the port.
#
# The bridge sends finished matches only to an https results_url, so the
# proxy serves the connector's results path too (say
# https://<bridge host>/ember/results to BRACKETS_PORT) and the desk
# connection's results_url names it.
#
# Public rooms need the room supervisor's loopback API (rooms.supervisor_url),
# and the container's loopback is its own, not the host's: leave `rooms` out
# of bridge.json here, or the bridge logs that the supervisor did not answer.
#
# First run:
#   docker compose run --rm bridge ember-bridge init /var/lib/ember
#   then merge the instance's tenants file into $BRIDGE_DATA/bridge.json as
#   bridge/deploy/setup.sh does (keeping bridge_id, database and secrets),
#   with "listen": "0.0.0.0:8470"
#   docker compose up -d
services:
  bridge:
    image: ember-bridge
    build:
      context: ../../..
      dockerfile: server/ember/docker/Dockerfile
    command: ["ember-bridge", "serve", "/var/lib/ember/bridge.json"]
    restart: unless-stopped
    user: "${BRIDGE_USER:-4784:4784}"
    ports:
      - "${BRIDGE_BIND:-127.0.0.1}:${BRIDGE_PORT:?set BRIDGE_PORT}:8470"
    volumes:
      - "${BRIDGE_DATA:?set BRIDGE_DATA}:/var/lib/ember"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  brackets:
    image: ember-bridge
    profiles: ["brackets"]
    command: ["ember-brackets", "serve", "/var/lib/ember/brackets.json"]
    restart: unless-stopped
    user: "${BRIDGE_USER:-4784:4784}"
    ports:
      - "${BRIDGE_BIND:-127.0.0.1}:${BRACKETS_PORT:-8791}:8791"
    volumes:
      - "${BRACKETS_DATA:-./brackets}:/var/lib/ember"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  notifier:
    image: ember-bridge
    profiles: ["notifier"]
    command: ["ember-notifier", "serve", "/var/lib/ember/notifier.json"]
    restart: unless-stopped
    user: "${BRIDGE_USER:-4784:4784}"
    env_file:
      - path: "${NOTIFIER_DATA:-./notifier}/notifier.env"
        required: false
    ports:
      - "${BRIDGE_BIND:-127.0.0.1}:${NOTIFIER_PORT:-8790}:8790"
    volumes:
      - "${NOTIFIER_DATA:-./notifier}:/var/lib/ember"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
