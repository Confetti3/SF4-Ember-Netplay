# Ember bracket connector: request budget per client address for the results
# URL. The bridge sends one signed delivery per finished match, so this is far
# above any real use; it only bounds a caller that is not the bridge.
limit_req_zone $binary_remote_addr zone=ember_brackets:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ember_brackets_conn:1m;
