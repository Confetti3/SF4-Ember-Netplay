[package]
name = "ember-protocol"
description = "Wire rules shared by the Ember helper, bridge and SDK conformance tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The client the services that call a bridge share (`client`); the helper
# does not compile it.
client = ["dep:reqwest"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "=3.0.0"
hmac = "0.12"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2"
zeroize = "1"
