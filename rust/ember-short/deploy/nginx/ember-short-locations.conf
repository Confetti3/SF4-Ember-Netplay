# Ember short invitation links, included in the embernetplay.link 443 server.
#
# /s/ is the store API on 127.0.0.1:47810. Its paths carry only opaque
# locators, and nothing here logs them.
# /j is the page a short link opens. The code is in the URL fragment, which
# browsers never send, so the server sees only "/j".

location ^~ /s/ {
    access_log off;
    limit_req zone=ember_short burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:47810;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_buffering off;
    proxy_intercept_errors off;
}

location = /j {
    access_log off;
    try_files /j.html =404;
    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}

# A link typed with the code in the path (/j/CODE) opens the same page.
location ^~ /j/ {
    access_log off;
    try_files /j.html =404;
    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
