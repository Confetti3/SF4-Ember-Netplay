[package]
name = "sf4-net"
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
base64 = "0.22"
blake3 = "1"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
iroh = "=1.1.0"
openraft = { version = "=0.9.25", features = ["serde"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10.9"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[profile.release]
strip = "debuginfo"
lto = "thin"
