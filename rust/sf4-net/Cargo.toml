[package]
name = "sf4-net"
version = "0.8.2"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
ember-protocol = { path = "../ember/protocol" }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
iroh = { version = "=1.1.0", features = ["unstable-net-report"] }
openraft = { version = "=0.9.25", features = ["serde"] }
rand = "0.10"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10.9"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
webpki-roots = "1"
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
# The tournament worker's tests run against the real bridge on loopback.
ember-bridge = { path = "../ember/bridge" }
ember-short = { path = "../ember-short" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Com", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell"] }

[profile.release]
strip = "debuginfo"
lto = "thin"
