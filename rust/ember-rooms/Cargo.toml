[package]
name = "ember-rooms"
description = "Public room supervisor for SF4 Ember Netplay: runs one room host process per public room"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[features]
# Builds the stand-in room host the integration tests drive. The crate lists
# itself as a dev-dependency with this feature, so `cargo test` enables it.
test-fake-host = []

[[bin]]
name = "fake_room_host"
path = "src/bin/fake_room_host.rs"
required-features = ["test-fake-host"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
ember-rooms = { path = ".", features = ["test-fake-host"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
strip = "debuginfo"
lto = "thin"
